services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
    networks:
      - backend
    restart: always

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mini-rag-app
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=mini_rag
    networks:
      - backend
    restart: always

networks:
  backend:
    driver: bridge